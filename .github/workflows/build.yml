name: Build TOS package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Python
        run: python -m compileall -q backend

      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --test tests/frontend_search_state.test.js

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

      - name: Build x86_64 package
        run: python build.py --platform x86_64

      - name: Build aarch64 package
        run: python build.py --platform aarch64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lan-mac-finder-packages
          path: |
            dist/*.deb
            dist/*.sha256

      - name: Attach packages to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.deb dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LAN MAC Finder ${GITHUB_REF_NAME}" \
            --generate-notes
